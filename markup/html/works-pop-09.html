<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body>
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="운영전환신청">
                    <article class="kt-work-pop kt-work-pop--h660">
                        <header class="kt-work-pop__header">
                            <h1 class="kt-work-pop__title">운영전환신청</h1>
                            <button type="button" class="kt-work-pop__close popup__close" aria-label="닫기">
                                <img src="/assets/img/works/ico_work_close.svg" alt="" aria-hidden="true" />
                            </button>
                        </header>
                        <div class="kt-work-pop__body">
                            <div class="kt-work-pop__content">
                                <div class="kt-work-pop__section kt-work-pop__section--gap16">
                                    <strong class="kt-work-pop__section-title">myK 사내직원인증 (A0001)</strong>
                                    <div class="kt-work-pop__field kt-work-pop__field--tall">
                                        <p class="kt-work-pop__label">전환사유 <span class="kt-work-pop__required">*</span></p>
                                        <div class="kt-work-pop__textarea-box">
                                            <textarea class="kt-work-pop__textarea" maxlength="200" placeholder="운영 전환이 필요한 사유를 입력해 주세요" aria-label="전환사유"></textarea>
                                            <span class="kt-work-pop__textarea-count">0/200</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="kt-work-pop__footer">
                            <button type="button" class="kt-work-pop__button kt-work-pop__button--secondary popup__close">취소</button>
                            <button type="button" class="kt-work-pop__button">PRD 반영신청</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
