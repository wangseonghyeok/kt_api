<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body>
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="운영전환 승인처리">
                    <article class="kt-work-pop kt-admin-pop kt-admin-pop--h700">
                        <header class="kt-work-pop__header">
                            <h1 class="kt-work-pop__title">운영전환 승인처리</h1>
                            <button type="button" class="kt-work-pop__close popup__close" aria-label="닫기">
                                <img src="/assets/img/works/ico_work_close.svg" alt="" aria-hidden="true" />
                            </button>
                        </header>
                        <div class="kt-work-pop__body">
                            <div class="kt-admin-pop__content">
                                <div class="kt-admin-pop__status-card kt-admin-pop__status-card--positive">Dev → Prod 전환</div>
                                <div class="kt-admin-pop__field kt-admin-pop__field--textarea">
                                    <p class="kt-admin-pop__label">신청 사유</p>
                                    <div class="kt-admin-pop__textarea kt-admin-pop__textarea--readonly">
                                        <textarea class="kt-admin-pop__textarea-control" readonly aria-label="신청 사유">
DEV 환경 테스트 완료 후 상용 전환 신청합니다. QA 검증 완료, 배포 예정일 2026.04.15</textarea
                                        >
                                    </div>
                                </div>
                                <div class="kt-admin-pop__result">
                                    <p class="kt-admin-pop__label">처리 결과 선택</p>
                                    <div class="kt-admin-pop__radio-list">
                                        <label class="kt-radio kt-admin-pop__radio"><input type="radio" name="adminWork04Result" checked /><span>반려</span></label>
                                        <label class="kt-radio kt-admin-pop__radio"><input type="radio" name="adminWork04Result" /><span>승인</span></label>
                                    </div>
                                </div>
                                <div class="kt-admin-pop__field kt-admin-pop__field--reject">
                                    <p class="kt-admin-pop__label">반려시 반려사유 입력</p>
                                    <div class="kt-admin-pop__textarea kt-admin-pop__textarea--reject">
                                        <textarea
                                            class="kt-admin-pop__textarea-control"
                                            maxlength="200"
                                            placeholder="반려사유를 구체적으로 입력해 주세요."
                                            aria-label="반려시 반려사유 입력"
                                        ></textarea>
                                        <span class="kt-admin-pop__count">0/200</span>
                                    </div>
                                </div>
                                <div class="kt-admin-pop__field">
                                    <p class="kt-admin-pop__label">승인자</p>
                                    <div class="kt-admin-pop__readonly">최재혁</div>
                                </div>
                            </div>
                        </div>
                        <footer class="kt-work-pop__footer">
                            <button type="button" class="kt-work-pop__button kt-work-pop__button--secondary popup__close">취소</button>
                            <button type="button" class="kt-work-pop__button">확인</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
