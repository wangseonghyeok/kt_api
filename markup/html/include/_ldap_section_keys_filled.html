<section class="kt-ws-section kt-ldap-section-keys-filled">
    <div class="kt-ws-section__head">
        <h2 class="kt-ws-section__title">API Keys</h2>
        <button type="button" class="kt-btn kt-btn--popup">편집</button>
    </div>
    <div class="kt-panel-grid">
        <div class="kt-key-card">
            <div class="kt-key-card__title">
                <span>DEVKey</span>
                <span class="kt-key-card__expiry">만료일 : 2027.05.06</span>
            </div>
            <div class="kt-key-card__body">
                <div class="kt-key-field">
                    <div class="kt-key-field__input">
                        <label for="dev-key-id">Key ID</label>
                        <input id="dev-key-id" type="text" class="kt-input" value="DEV-KT-HNR-20260401-001" readonly />
                    </div>
                    <button type="button" class="kt-key-field__copy" aria-label="Key ID 복사">
                        <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                    </button>
                </div>
                <div class="kt-key-field">
                    <div class="kt-key-field__input">
                        <label for="dev-key-pw">Key Pw</label>
                        <input id="dev-key-pw" type="password" class="kt-input" value="12345678" readonly />
                    </div>
                    <button type="button" class="kt-key-field__copy" aria-label="Key Password 보기">
                        <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/components/ico_eye_off.svg" alt="" aria-hidden="true" />
                    </button>
                    <button type="button" class="kt-key-field__copy" aria-label="Key Password 복사">
                        <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                    </button>
                </div>
            </div>
        </div>
        <div class="kt-key-card">
            <div class="kt-key-card__title">PRDKey</div>
            <div class="kt-key-card__empty">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <p>PRD 전환 후 PRD Key가 발급됩니다.</p>
            </div>
        </div>
    </div>
    <div class="kt-edit-template kt-edit-box">
        <strong class="kt-edit-box__title">API Keys 편집모드</strong>
        <div class="kt-panel-grid">
            <div class="kt-key-card">
                <div class="kt-key-card__title">
                    <span>DEVKey</span>
                    <span class="kt-key-card__expiry">만료일 : 2027.05.06</span>
                </div>
                <div class="kt-key-card__body">
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="edit-dev-key-id">Key ID</label>
                            <input id="edit-dev-key-id" type="text" class="kt-input" value="DEV-KT-HNR-20260401-001" readonly />
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="Key ID 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="edit-dev-key-pw">Key Pw</label>
                            <input id="edit-dev-key-pw" type="password" class="kt-input" value="12345678" readonly />
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="Key Password 보기">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/components/ico_eye_off.svg" alt="" aria-hidden="true" />
                        </button>
                        <button type="button" class="kt-key-field__copy" aria-label="Key Password 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                </div>
            </div>
            <div class="kt-key-card">
                <div class="kt-key-card__title">PRDKey</div>
                <div class="kt-key-card__body">
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="edit-prd-key-id">Key ID</label>
                            <input id="edit-prd-key-id" type="text" class="kt-input" placeholder="PRD 전환 후 발급됩니다." readonly />
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
