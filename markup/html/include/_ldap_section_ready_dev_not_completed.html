<!-- Common Not Completed status: use kt-ldap-section-ready--not-completed on the section and kt-ready-status--not-completed on each status text. -->
<section class="kt-ws-section kt-ldap-section-ready kt-ldap-section-ready--not-completed">
    <div class="kt-ws-section__head">
        <h2 class="kt-ws-section__title">DEV 전환 준비 상태</h2>
    </div>
    <table class="kt-info-table kt-ready-table" aria-label="DEV 전환 준비 상태">
        <colgroup>
            <col class="kt-info-table__label-col" />
            <col />
            <col class="kt-info-table__label-col" />
            <col />
        </colgroup>
        <tbody>
            <tr>
                <th scope="row" class="kt-info-table__label">API 승인 상태</th>
                <td class="kt-info-table__value">
                    <!-- Not Completed status icon/text -->
                    <span class="kt-ready-status kt-ready-status--not-completed"><span class="kt-ready-status__icon" aria-hidden="true"></span>Not Completed</span>
                </td>
                <th scope="row" class="kt-info-table__label kt-ready-table__label--border-left">IP 승인 상태</th>
                <td class="kt-info-table__value">
                    <span class="kt-ready-status kt-ready-status--not-completed"><span class="kt-ready-status__icon" aria-hidden="true"></span>Not Completed</span>
                </td>
            </tr>
        </tbody>
    </table>
</section>
