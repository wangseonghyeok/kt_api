<!--
    개발 전달: Entra ID 워크스페이스 상세의 API Keys 빈 상태입니다.
-->
<section class="kt-ws-section kt-ldap-section-keys-empty kt-entra-section-keys-empty">
    <div class="kt-ws-section__head">
        <h2 class="kt-ws-section__title">API Keys</h2>
        <button type="button" class="kt-btn kt-btn--popup">편집</button>
    </div>
    <div class="kt-panel-grid">
        <div class="kt-key-card">
            <div class="kt-key-card__title">DEVKey</div>
            <div class="kt-key-card__empty">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <p>Dev 전환 후 DEV Key가 발급됩니다</p>
            </div>
        </div>
        <div class="kt-key-card">
            <div class="kt-key-card__title">PRDKey</div>
            <div class="kt-key-card__empty">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <p>PRD 전환 후 PRD Key가 발급됩니다</p>
            </div>
        </div>
    </div>
    <div class="kt-edit-template kt-edit-box">
        <strong class="kt-edit-box__title">API Keys 편집모드</strong>
        <div class="kt-panel-grid">
            <div class="kt-key-card">
                <div class="kt-key-card__title">DEVKey</div>
                <div class="kt-key-card__body">
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="entra-dev-key-id">Key ID</label>
                            <input id="entra-dev-key-id" type="text" class="kt-input" placeholder="Dev 전환 후 발급됩니다." readonly />
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="DEV Key ID 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                    <div class="kt-key-field kt-key-field--password">
                        <div class="kt-key-field__input">
                            <label for="entra-dev-key-pw">Key Pw</label>
                            <div class="kt-key-field__control">
                                <input id="entra-dev-key-pw" type="password" class="kt-input" placeholder="Dev 전환 후 발급됩니다." readonly />
                                <button type="button" class="kt-key-field__visibility" aria-label="DEV Key Password 보기">
                                    <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/components/ico_eye_off.svg" alt="" aria-hidden="true" />
                                </button>
                            </div>
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="DEV Key Password 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                </div>
            </div>
            <div class="kt-key-card">
                <div class="kt-key-card__title">PRDKey</div>
                <div class="kt-key-card__body">
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="entra-prd-key-id">Key ID</label>
                            <input id="entra-prd-key-id" type="text" class="kt-input" placeholder="PRD 전환 후 발급됩니다." readonly />
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="PRD Key ID 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                    <div class="kt-key-field kt-key-field--password">
                        <div class="kt-key-field__input">
                            <label for="entra-prd-key-pw">Key Pw</label>
                            <div class="kt-key-field__control">
                                <input id="entra-prd-key-pw" type="password" class="kt-input" placeholder="PRD 전환 후 발급됩니다." readonly />
                                <button type="button" class="kt-key-field__visibility" aria-label="PRD Key Password 보기">
                                    <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/components/ico_eye_off.svg" alt="" aria-hidden="true" />
                                </button>
                            </div>
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="PRD Key Password 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="kt-ldap-edit-actions">
            <button type="button" class="kt-btn kt-btn--popup" data-edit-cancel>취소</button>
            <button type="button" class="kt-btn kt-btn--popup kt-btn--popup-primary" data-edit-save>저장</button>
        </div>
    </div>
</section>
