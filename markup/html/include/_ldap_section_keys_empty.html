<section class="kt-ws-section kt-ldap-section-keys-empty">
    <div class="kt-ws-section__head">
        <h2 class="kt-ws-section__title">API Keys</h2>
        <!-- <button type="button" class="kt-btn kt-btn--detail">편집</button> -->
    </div>
    <div class="kt-panel-grid">
        <div class="kt-key-card">
            <div class="kt-key-card__title">
                <span>DEVKey</span>
                <!-- <span class="kt-key-card__expiry">만료일 : 2027.05.06</span> -->
            </div>
            <!-- Draft 상태일때 -->
            <div class="kt-key-card__empty">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <p>Dev 전환 후 DEV Key가 발급됩니다</p>
            </div>
            <!-- Dev 상태에서 민감 API 구독 신청 후 미승인 상태일때 -->
            <div class="kt-key-card__empty" style="display: none">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <h2>민감 API 추가 승인 대기</h2>
                <p>구독 신청한 민감 API 승인 완료 후 DEV Key가 자동 발급됩니다</p>
            </div>
        </div>
        <div class="kt-key-card">
            <div class="kt-key-card__title">
                <span>PRDKey</span>
                <!-- <span class="kt-key-card__expiry">만료 : 2027.05.10 (D-187)</span> -->
            </div>
            <!-- Draft 상태일때 -->
            <div class="kt-key-card__empty">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <p>PRD 전환 후 PRD Key가 발급됩니다.</p>
            </div>
            <!-- Dev 상태에서 민감 API 구독 신청 후 미승인 상태일때 -->
            <div class="kt-key-card__empty" style="display: none">
                <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_ldap_key.svg" alt="" aria-hidden="true" />
                <h2>PRD Key</h2>
                <p>Prod 전환 후 자동 발급</p>
            </div>
        </div>
    </div>
    <div class="kt-edit-template kt-edit-box">
        <strong class="kt-edit-box__title">API Keys 편집모드</strong>
        <div class="kt-panel-grid">
            <div class="kt-key-card">
                <div class="kt-key-card__title">
                    <span>DEVKey</span>
                    <span class="kt-key-card__expiry">만료일 : 2027.05.06</span>
                </div>
                <div class="kt-key-card__body">
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="draft-dev-key-id">Key ID</label>
                            <input id="draft-dev-key-id" type="text" class="kt-input" placeholder="Dev 전환 후 발급됩니다." readonly />
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="DEV Key ID 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                    <div class="kt-key-field kt-key-field--password">
                        <div class="kt-key-field__input">
                            <label for="draft-dev-key-pw">Key Pw</label>
                            <div class="kt-key-field__control">
                                <input id="draft-dev-key-pw" type="password" class="kt-input" placeholder="Dev 전환 후 발급됩니다." readonly />
                                <button
                                    type="button"
                                    class="kt-key-field__visibility"
                                    data-password_toggle
                                    data-icon-show="/assets/img/components/ico_eye.svg"
                                    data-icon-hide="/assets/img/components/ico_eye_off.svg"
                                    aria-controls="draft-dev-key-pw"
                                    aria-pressed="false"
                                    aria-label="DEV Key Password 보기"
                                >
                                    <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/components/ico_eye.svg" alt="" aria-hidden="true" />
                                </button>
                            </div>
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="DEV Key Password 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                </div>
            </div>
            <div class="kt-key-card">
                <div class="kt-key-card__title">
                    <span>PRDKey</span>
                    <span class="kt-key-card__expiry">만료 : 2027.05.10 (D-187)</span>
                </div>
                <div class="kt-key-card__body">
                    <div class="kt-key-field">
                        <div class="kt-key-field__input">
                            <label for="draft-prd-key-id">Key ID</label>
                            <input id="draft-prd-key-id" type="text" class="kt-input" placeholder="PRD 전환 후 발급됩니다." readonly />
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="PRD Key ID 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                    <div class="kt-key-field kt-key-field--password">
                        <div class="kt-key-field__input">
                            <label for="draft-prd-key-pw">Key Pw</label>
                            <div class="kt-key-field__control">
                                <input id="draft-prd-key-pw" type="password" class="kt-input" placeholder="PRD 전환 후 발급됩니다." readonly />
                                <button
                                    type="button"
                                    class="kt-key-field__visibility"
                                    data-password_toggle
                                    data-icon-show="/assets/img/components/ico_eye.svg"
                                    data-icon-hide="/assets/img/components/ico_eye_off.svg"
                                    aria-controls="draft-prd-key-pw"
                                    aria-pressed="false"
                                    aria-label="PRD Key Password 보기"
                                >
                                    <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/components/ico_eye.svg" alt="" aria-hidden="true" />
                                </button>
                            </div>
                        </div>
                        <button type="button" class="kt-key-field__copy" aria-label="PRD Key Password 복사">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_tool_duplicate.svg" alt="" aria-hidden="true" />
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
