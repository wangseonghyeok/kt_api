<section class="kt-ws-section kt-ldap-section-members kt-ldap-section-members-empty">
    <div class="kt-ws-section__head">
        <h2 class="kt-ws-section__title">
            Members
            <span class="kt-ws-section__count"><strong>0</strong><span>명</span></span>
        </h2>
        <button type="button" class="kt-btn kt-btn--popup">편집</button>
    </div>
    <table class="kt-data-table kt-data-table--members">
        <caption class="blind">
            멤버 목록
        </caption>
        <colgroup>
            <col style="width: 20%" />
            <col style="width: 20%" />
            <col style="width: 20%" />
            <col style="width: 20%" />
            <col style="width: 20%" />
        </colgroup>
        <thead>
            <tr>
                <th scope="col">이름</th>
                <th scope="col">이메일</th>
                <th scope="col">소속</th>
                <th scope="col">역할</th>
                <th scope="col">지정 방식</th>
            </tr>
        </thead>
        <tbody>
            <tr class="kt-data-table__empty">
                <td colspan="5">
                    <div class="kt-table-empty-result">
                        <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_warning_empty.svg" alt="" aria-hidden="true" />
                        <p>등록된 Members가 없습니다.</p>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="kt-edit-template kt-edit-box">
        <strong class="kt-edit-box__title">멤버 편집모드</strong>
        <section class="kt-works-search kt-works-search--demo kt-ldap-filter" aria-label="멤버 검색">
            <div class="kt-works-search__row kt-ldap-member-filter">
                <div class="kt-prompt kt-prompt--works kt-prompt--wide" data-prompt data-prompt-show-all>
                    <div class="kt-prompt__field">
                        <input
                            type="text"
                            id="draftMemberKeyword"
                            class="kt-input kt-input--40"
                            placeholder="이름 또는 이메일을 입력하세요"
                            data-prompt_trg
                            data-ldap-member-search
                            aria-controls="draftMemberPromptMenu"
                            aria-expanded="false"
                            autocomplete="off"
                        />
                        <span class="kt-prompt__actions">
                            <button type="button" data-clear_input aria-controls="draftMemberKeyword" aria-label="검색어 삭제" hidden>
                                <img src="/assets/img/components/ico_delete.svg" alt="" />
                            </button>
                            <button type="button" aria-label="멤버 검색">
                                <img src="/assets/img/components/ico_search.svg" alt="" />
                            </button>
                        </span>
                    </div>
                    <div class="kt-prompt__menu" id="draftMemberPromptMenu" data-prompt_menu data-prompt-visible-count="5" role="listbox">
                        <ul class="kt-prompt__api-list kt-prompt__workspace-list"></ul>
                        <p class="kt-prompt__foot" data-prompt_foot data-prompt-foot-text="검색 가능한 멤버가 없습니다." hidden aria-hidden="true"></p>
                    </div>
                </div>
            </div>
        </section>
        <table class="kt-data-table kt-data-table--members kt-data-table--members-edit">
            <caption class="blind">
                멤버 검색 결과
            </caption>
            <colgroup>
                <col style="width: 20%" />
                <col style="width: 20%" />
                <col style="width: 20%" />
                <col style="width: 20%" />
                <col style="width: 20%" />
            </colgroup>
            <thead>
                <tr>
                    <th scope="col">이름</th>
                    <th scope="col">이메일</th>
                    <th scope="col">소속</th>
                    <th scope="col">역할</th>
                    <th scope="col">지정 방식</th>
                </tr>
            </thead>
            <tbody>
                <tr class="kt-data-table__empty kt-data-table__empty--result" data-member-empty>
                    <td colspan="5">
                        <div class="kt-table-empty-result">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_warning_empty.svg" alt="" aria-hidden="true" />
                            <p>등록된 Members가 없습니다.</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
