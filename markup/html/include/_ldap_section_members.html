<!--
    개발 전달: LDAP Draft 화면의 Members 빈 상태 + 편집 샘플입니다.
    검색 후보는 data-member-* 속성을 ldap-workspace.js가 읽어 편집 테이블/읽기 테이블 행으로 복사합니다.
-->
<section class="kt-ws-section kt-ldap-section-members">
    <div class="kt-ws-section__head">
        <h2 class="kt-ws-section__title">
            Members
            <span class="kt-ws-section__count"><strong>0</strong><span>명</span></span>
        </h2>
        <button type="button" class="kt-btn kt-btn--detail">편집</button>
    </div>
    <table class="kt-data-table kt-data-table--members">
        <caption class="blind">
            멤버 목록
        </caption>
        <colgroup>
            <col style="width: 20%" />
            <col style="width: 20%" />
            <col style="width: 20%" />
            <col style="width: 20%" />
            <col style="width: 20%" />
        </colgroup>
        <thead>
            <tr>
                <th scope="col">이름</th>
                <th scope="col">이메일</th>
                <th scope="col">소속</th>
                <th scope="col">역할</th>
                <th scope="col">지정 방식</th>
            </tr>
        </thead>
        <tbody>
            <tr class="kt-data-table__empty kt-data-table__empty--result" data-member-read-empty>
                <td colspan="5">
                    <div class="kt-table-empty-result">
                        <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_warning_empty.svg" alt="" aria-hidden="true" />
                        <p>등록된 Members가 없습니다.</p>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>
    <div class="kt-edit-template kt-edit-box">
        <strong class="kt-edit-box__title">멤버 편집모드</strong>
        <section class="kt-ldap-filter" aria-label="멤버 검색">
            <div class="kt-ldap-member-filter">
                <div class="kt-newwork-search kt-ldap-newwork-search" data-ldap-search data-ldap-search-type="member" data-min-length="1">
                    <div class="kt-newwork-search__field">
                        <input
                            type="text"
                            id="ldapMemberKeyword"
                            class="kt-input kt-input--40"
                            placeholder="이름 또는 이메일을 입력하세요"
                            data-ldap-member-search
                            aria-controls="ldapMemberSearchMenu"
                            aria-expanded="false"
                            autocomplete="off"
                        />
                        <button type="button" class="kt-newwork-search__clear" data-ldap-search-clear aria-controls="ldapMemberKeyword" aria-label="검색어 삭제" hidden>
                            <span class="blind">검색어 삭제</span>
                        </button>
                        <button type="button" class="kt-newwork-search__submit" aria-label="멤버 검색">
                            <span class="blind">검색</span>
                        </button>
                    </div>
                    <div class="kt-newwork-search-menu kt-newwork-search-menu--member" id="ldapMemberSearchMenu" data-ldap-search-menu role="listbox">
                        <div class="kt-newwork-search-menu__head">
                            <span>검색 결과</span>
                            <strong data-ldap-search-count>5</strong>
                            <span>건</span>
                        </div>
                        <ul class="kt-newwork-search-menu__list kt-scrollbar">
                            <li>
                                <button
                                    type="button"
                                    role="option"
                                    tabindex="-1"
                                    aria-selected="false"
                                    data-ldap-search-option
                                    data-member-id="kim-cs"
                                    data-member-name="김철수"
                                    data-member-email="kim.cs@hanaro.com"
                                    data-member-company="하나로소프트"
                                    data-member-role="Owner"
                                    data-member-method="생성자 자동 지정"
                                    data-search="김철수 kim.cs@hanaro.com 하나로소프트 Owner"
                                >
                                    <span class="kt-newwork-search-icon" aria-hidden="true"></span>
                                    <strong>김철수</strong>
                                    <span>kim.cs@hanaro.com</span>
                                </button>
                            </li>
                            <li>
                                <button
                                    type="button"
                                    role="option"
                                    tabindex="-1"
                                    aria-selected="false"
                                    data-ldap-search-option
                                    data-member-id="lee-sh"
                                    data-member-name="이순희"
                                    data-member-email="lee.sh@kt.com"
                                    data-member-company="KT"
                                    data-member-role="Manager"
                                    data-member-method="KT Service PO 자동 지정"
                                    data-search="이순희 lee.sh@kt.com KT Manager"
                                >
                                    <span class="kt-newwork-search-icon" aria-hidden="true"></span>
                                    <strong>이순희</strong>
                                    <span>lee.sh@kt.com</span>
                                </button>
                            </li>
                            <li>
                                <button
                                    type="button"
                                    role="option"
                                    tabindex="-1"
                                    aria-selected="false"
                                    data-ldap-search-option
                                    data-member-id="park-je"
                                    data-member-name="박지은"
                                    data-member-email="park.je@hanaro.com"
                                    data-member-company="하나로소프트"
                                    data-member-role="Member"
                                    data-member-method="Owner 초대"
                                    data-search="박지은 park.je@hanaro.com 하나로소프트 Member"
                                >
                                    <span class="kt-newwork-search-icon" aria-hidden="true"></span>
                                    <strong>박지은</strong>
                                    <span>park.je@hanaro.com</span>
                                </button>
                            </li>
                            <li>
                                <button
                                    type="button"
                                    role="option"
                                    tabindex="-1"
                                    aria-selected="false"
                                    data-ldap-search-option
                                    data-member-id="kang-dh"
                                    data-member-name="강다희"
                                    data-member-email="kang.dh@hanaro.com"
                                    data-member-company="기술개발팀"
                                    data-member-role="Member"
                                    data-member-method="Owner 초대"
                                    data-search="강다희 kang.dh@hanaro.com 기술개발팀 Member"
                                >
                                    <span class="kt-newwork-search-icon" aria-hidden="true"></span>
                                    <strong>강다희</strong>
                                    <span>kang.dh@hanaro.com</span>
                                </button>
                            </li>
                            <li>
                                <button
                                    type="button"
                                    role="option"
                                    tabindex="-1"
                                    aria-selected="false"
                                    data-ldap-search-option
                                    data-member-id="choi-mj"
                                    data-member-name="최민준"
                                    data-member-email="choi.mj@hanaro.com"
                                    data-member-company="하나로소프트"
                                    data-member-role="Member"
                                    data-member-method="Manager 초대"
                                    data-search="최민준 choi.mj@hanaro.com 하나로소프트 Member"
                                >
                                    <span class="kt-newwork-search-icon" aria-hidden="true"></span>
                                    <strong>최민준</strong>
                                    <span>choi.mj@hanaro.com</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>
        <table class="kt-data-table kt-data-table--members kt-data-table--members-edit">
            <caption class="blind">
                멤버 검색 결과
            </caption>
            <colgroup>
                <col style="width: calc((100% - 120px) / 5)" />
                <col style="width: calc((100% - 120px) / 5)" />
                <col style="width: calc((100% - 120px) / 5)" />
                <col style="width: calc((100% - 120px) / 5)" />
                <col style="width: calc((100% - 120px) / 5)" />
                <col style="width: 120px" />
            </colgroup>
            <thead>
                <tr>
                    <th scope="col">이름</th>
                    <th scope="col">이메일</th>
                    <th scope="col">소속</th>
                    <th scope="col">역할</th>
                    <th scope="col">지정 방식</th>
                    <th scope="col">관리</th>
                </tr>
            </thead>
            <tbody>
                <tr class="kt-data-table__empty kt-data-table__empty--result" data-member-empty hidden>
                    <td colspan="6">
                        <div class="kt-table-empty-result">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_warning_empty.svg" alt="" aria-hidden="true" />
                            <p>검색 결과가 없습니다.</p>
                        </div>
                    </td>
                </tr>
                <tr class="kt-data-table__empty kt-data-table__empty--result" data-member-no-data-empty>
                    <td colspan="6">
                        <div class="kt-table-empty-result">
                            <img class="kt-svg-icon kt-svg-icon--24" src="/assets/img/contents/ico_warning_empty.svg" alt="" aria-hidden="true" />
                            <p>등록된 Members가 없습니다.</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>
