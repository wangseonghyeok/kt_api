<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body class="kt-newwork-page">
        <div id="wrap">
            <!--#include file="./include/_header.html"-->
            <main id="contents" class="kt-newwork-main">
                <section class="kt-page-header">
                    <div class="kt-page-header__title">
                        <h1>OAUTH 워크스페이스 만들기</h1>
                        <p>외부 파트너 (LDAP)</p>
                    </div>
                    <!--#include file="./include/_newwork_path_create.html"-->
                </section>

                <div class="kt-newwork-shell">
                    <ol class="kt-newwork-stepper" aria-label="OAuth 워크스페이스 생성 단계">
                        <li class="is-active"><span>01</span><strong>기본 정보 입력</strong></li>
                        <li><span>02</span><strong>OAuth 앱 설정</strong></li>
                        <li><span>03</span><strong>확인 및 저장</strong></li>
                    </ol>

                    <section class="kt-newwork-form">
                        <div class="kt-newwork-title">
                            <h2>기본 정보 입력</h2>
                            <p>워크스페이스 이름과 설명을 입력하세요.</p>
                        </div>

                        <div class="kt-newwork-field" data-newwork-input>
                            <label for="oauthWorkspaceName">Workspace Name <em>*</em></label>
                            <div class="kt-newwork-input-control">
                                <input id="oauthWorkspaceName" type="text" class="kt-input kt-input--52" placeholder="한글, 영문, 숫자, 공백 포함 2~50자 내외의 워크스페이스 이름을 입력해 주세요." />
                                <button type="button" class="kt-newwork-input-clear" data-newwork-input-clear hidden>
                                    <span class="blind">입력값 삭제</span>
                                </button>
                            </div>
                        </div>

                        <label class="kt-newwork-field kt-newwork-field--textarea">
                            <span>Description <em>*</em></span>
                            <textarea
                                id="oauthWorkspaceDescription"
                                class="kt-textarea"
                                maxlength="200"
                                placeholder="워크스페이스의 목적을 설명해 주세요."
                                data-textarea-count="oauthWorkspaceDescriptionCount"
                            ></textarea>
                            <i id="oauthWorkspaceDescriptionCount" data-textarea-count-output>0/200</i>
                        </label>

                        <div class="kt-newwork-field" data-newwork-input>
                            <label for="oauthServiceUrl">서비스 URL <em>*</em></label>
                            <div class="kt-newwork-input-control">
                                <input id="oauthServiceUrl" type="url" class="kt-input kt-input--52" placeholder="https://" />
                                <button type="button" class="kt-newwork-input-clear" data-newwork-input-clear hidden>
                                    <span class="blind">입력값 삭제</span>
                                </button>
                            </div>
                            <p class="kt-newwork-field__desc">실제 서비스가 운영되는 URL을 입력하세요.</p>
                        </div>

                        <label class="kt-newwork-field kt-newwork-field--disabled-map">
                            <span>Company</span>
                            <input type="text" class="kt-input kt-input--52 kt-input--disabled-map" value="하나로소프트" disabled />
                            <small class="kt-newwork-field__help">LDAP 계정 소속 Company가 자동으로 매핑됩니다</small>
                        </label>
                    </section>

                    <div class="kt-actions">
                        <button type="button" class="kt-btn kt-btn--secondary kt-btn--form">취소</button>
                        <button type="button" class="kt-btn kt-btn--primary kt-btn--form">다음</button>
                    </div>
                </div>
            </main>
            <!--#include file="./include/_footer.html"-->
        </div>
    </body>
</html>
