<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body>
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="Workspace 맵핑 취소">
                    <article class="kt-swac-confirm" role="document">
                        <header class="kt-swac-confirm__header">
                            <h2>Workspace 맵핑 취소</h2>
                            <button type="button" class="kt-auth-close popup__close"><span class="blind">닫기</span></button>
                        </header>
                        <div class="kt-swac-confirm__body">
                            <span class="kt-swac-confirm__icon" aria-hidden="true"></span>
                            <h3 id="swacCancelTitle">기존 Workspace, API Key 및 권한 정보를 사용할 수 없습니다.</h3>
                            <p>
                                기존 서비스 연결은 최초 로그인 시에만 가능합니다.<br />
                                연결 없이 계속 진행하시겠습니까?
                            </p>
                        </div>
                        <footer class="kt-swac-confirm__actions">
                            <button type="button" class="kt-btn kt-btn--secondary kt-btn--xl kt-swac-confirm__button">연결 없이 계속</button>
                            <button type="button" class="kt-btn kt-btn--primary kt-btn--xl kt-swac-confirm__button">기존 서비스 연결하기</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
