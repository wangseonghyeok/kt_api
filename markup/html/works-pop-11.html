<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body class="kt-work-pop-page">
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="PRD Key 재발급">
                    <article class="kt-work-pop kt-work-pop--h660">
                        <header class="kt-work-pop__header">
                            <h1 class="kt-work-pop__title">PRD Key 재발급</h1>
                            <button type="button" class="kt-work-pop__close popup__close" aria-label="닫기">
                                <img src="/assets/img/auth/ico_auth_close.svg" alt="" aria-hidden="true" />
                            </button>
                        </header>
                        <div class="kt-work-pop__body">
                            <div class="kt-work-pop__content">
                                <div class="kt-work-pop__guide">
                                    <div class="kt-work-pop__guide-head kt-work-pop__guide-head--critical">
                                        <img src="/assets/img/works/ico_work_warning.svg" alt="" aria-hidden="true" />
                                        <strong>주의사항</strong>
                                    </div>
                                    <ul class="kt-work-pop__guide-list">
                                        <li>기존 PRD Key는 즉시 만료됩니다.</li>
                                        <li>재발급 즉시 운영 중인 서비스에서 API 호출이 중단될 수 있습니다.</li>
                                        <li>새 Key를 서비스에 빠르게 적용해야 합니다.</li>
                                    </ul>
                                </div>
                                <div class="kt-work-pop__key-box">
                                    <strong class="kt-work-pop__key-title">현재 KEY 정보</strong>
                                    <ul class="kt-work-pop__key-list">
                                        <li><span>KEY ID</span><strong>PRD-KT-HNR-20260401-001</strong></li>
                                        <li><span>만료일</span><strong>2026.04.30</strong></li>
                                    </ul>
                                </div>
                                <div class="kt-work-pop__field kt-work-pop__field--short">
                                    <p class="kt-work-pop__label">재발급 사유 입력 <span class="kt-work-pop__required">*</span></p>
                                    <div class="kt-work-pop__textarea-box" role="textbox" aria-label="재발급 사유 입력">
                                        <p>운영 전환이 필요한 사유를 입력해 주세요</p>
                                        <span class="kt-work-pop__fake-scroll" aria-hidden="true"></span>
                                        <span class="kt-work-pop__textarea-count">0/200</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="kt-work-pop__footer">
                            <button type="button" class="kt-work-pop__button kt-work-pop__button--secondary popup__close">취소</button>
                            <button type="button" class="kt-work-pop__button">운영전환 신청</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
