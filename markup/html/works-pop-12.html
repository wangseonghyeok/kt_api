<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body>
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="Key 연장 재신청">
                    <article class="kt-work-pop kt-work-pop--w680 kt-work-pop--h640 kt-work-pop--key-form">
                        <header class="kt-work-pop__header">
                            <h1 class="kt-work-pop__title">Key 연장 재신청</h1>
                            <button type="button" class="kt-work-pop__close popup__close" aria-label="닫기">
                                <img src="/assets/img/works/ico_work_close.svg" alt="" aria-hidden="true" />
                            </button>
                        </header>
                        <div class="kt-work-pop__body">
                            <div class="kt-work-pop__content">
                                <div class="kt-work-pop__reject">
                                    <span class="kt-work-pop__reject-tag">반려 사유</span>
                                    <p>Key 갱신 신청 사용 목적 기재가 불충분합니다.</p>
                                </div>
                                <div class="kt-work-pop__field kt-work-pop__field--reapply">
                                    <p class="kt-work-pop__label">보안사유 입력 <span class="kt-work-pop__required">*</span></p>
                                    <div class="kt-work-pop__textarea-box">
                                        <textarea
                                            class="kt-work-pop__textarea"
                                            maxlength="200"
                                            placeholder="반려 사유에 대한 보안 내용을 구체적으로 입력해주세요."
                                            aria-label="보안사유 입력"
                                        ></textarea>
                                        <span class="kt-work-pop__textarea-count">0/200</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="kt-work-pop__footer kt-work-pop__footer--gap12">
                            <button type="button" class="kt-work-pop__button kt-work-pop__button--secondary popup__close">취소</button>
                            <button type="button" class="kt-work-pop__button">재신청</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
