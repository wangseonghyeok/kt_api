<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
    </head>

    <body class="kt-user-page">
        <div id="wrap">
            <!--#include file="./include/_header.html"-->
            <main id="contents" class="kt-user-main">
                <section class="kt-page-header">
                    <div class="kt-page-header__title">
                        <h1>정보변경</h1>
                        <span>개인정보 및 비밀번호를 관리합니다.</span>
                    </div>
                    <nav class="kt-path" aria-label="현재 위치">
                        <a href="Ma-001.html" class="kt-path__home"><span class="blind">Home</span></a>
                        <span class="kt-path__separator" aria-hidden="true"></span>
                        <p>My page</p>
                        <span class="kt-path__separator" aria-hidden="true"></span>
                        <strong>회원탈퇴</strong>
                    </nav>
                </section>
                <div class="kt-user-shell" data-user-main-tabs>
                    <nav class="kt-line-tabs kt-line-tabs--fill" aria-label="정보변경 메뉴">
                        <ul>
                            <li><a href="#" data-user-main-tab="profile">개인정보 변경</a></li>
                            <li><a href="#" data-user-main-tab="password">비밀번호 변경</a></li>
                            <li><a href="#" data-user-main-tab="withdraw" class="is-active">회원탈퇴</a></li>
                        </ul>
                    </nav>
                    <ul class="kt-user-panels">
                        <li class="kt-user-panel" data-user-main-panel="profile" hidden aria-hidden="true">
                            <div class="kt-user-placeholder">텍스트 1</div>
                        </li>
                        <li class="kt-user-panel" data-user-main-panel="password" hidden aria-hidden="true">
                            <div class="kt-user-placeholder">텍스트 2</div>
                        </li>
                        <li class="kt-user-panel is-active" data-user-main-panel="withdraw">
                            <section class="kt-user-form">
                                <div class="kt-user-title">
                                    <h2>비밀번호 확인</h2>
                                    <p>본인 확인을 위해 비밀번호 확인이 필요합니다.</p>
                                </div>
                                <form class="kt-user-form-body kt-user-form-body--spacious">
                                    <label class="kt-field kt-user-field">
                                        <span class="kt-field__label">비밀번호</span>
                                        <span class="kt-password">
                                            <input type="password" id="userWithdrawPasswordConfirm" class="kt-input kt-input--52" placeholder="비밀번호를 입력해 주세요" />
                                            <span class="kt-password__actions">
                                                <button
                                                    type="button"
                                                    class="kt-input-field__clear kt-password__clear"
                                                    data-clear_input
                                                    aria-controls="userWithdrawPasswordConfirm"
                                                    aria-label="비밀번호 삭제"
                                                    hidden
                                                >
                                                    <img src="./assets/img/components/ico_delete.svg" alt="" />
                                                </button>
                                                <button
                                                    type="button"
                                                    class="kt-password__toggle"
                                                    data-password_toggle
                                                    data-icon-show="./assets/img/components/ico_eye.svg"
                                                    data-icon-hide="./assets/img/components/ico_eye_off.svg"
                                                    aria-controls="userWithdrawPasswordConfirm"
                                                    aria-pressed="false"
                                                    aria-label="비밀번호 보기"
                                                >
                                                    <img src="./assets/img/components/ico_eye.svg" alt="" />
                                                </button>
                                            </span>
                                        </span>
                                        <span class="kt-field__message">팝업 차단 기능이 활성화된 경우 비밀번호를 변경할 수 없으니, 미리 팝업 차단을 해제해 주세요.</span>
                                    </label>
                                    <div class="kt-user-verify">
                                        <span class="kt-user-verify__label">인증번호</span>
                                        <div class="kt-user-verify__box">
                                            <input type="text" id="userWithdrawCode" value="123456" aria-label="인증번호" />
                                            <button type="button" class="kt-user-verify__clear" data-clear_input aria-controls="userWithdrawCode" aria-label="인증번호 삭제"></button>
                                            <span class="kt-user-verify__side">
                                                <span class="kt-user-verify__time">02:23</span>
                                                <button type="button" class="kt-user-verify__resend">인증번호 발송</button>
                                            </span>
                                        </div>
                                    </div>
                                </form>
                                <div class="kt-actions">
                                    <button type="button" class="kt-btn kt-btn--secondary kt-btn--form">취소</button>
                                    <button type="button" class="kt-btn kt-btn--primary kt-btn--form">입력완료</button>
                                </div>
                            </section>
                        </li>
                    </ul>
                </div>
            </main>
            <!--#include file="./include/_footer.html"-->
        </div>
    </body>
</html>
