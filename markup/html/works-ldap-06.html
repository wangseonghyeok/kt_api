<!DOCTYPE html>

    <head>

    <body class="kt-works-page kt-workspace-detail-page">

            <!--#include file="./include/_header.html"-->
            <main id="contents" class="kt-works-main kt-ldap-page-main">
                <!--#include file="./include/_ldap_page_header.html"-->
                <div class="kt-ldap-view">
                    <div class="kt-ldap-stage kt-ldap-stage--expired kt-ldap-stage--renew-rejected" aria-label="워크스페이스 상세 LDAP Expired Renew Rejected">
                        <article class="kt-ws-detail">
                            <div class="kt-ws-detail__body">

                                    <header class="kt-ws-detail__header">
                                        <h1 class="kt-ws-detail__title">하나로소프트_쿠폰서비스</h1>

                                                    <span class="kt-ws-summary__badges">

                                                    </span>
                                                </div>
                                                <p class="kt-ws-summary__desc">쿠폰 발급 및 조회 서비스를 위한 API 연동 워크스페이스</p>
                                            </div>
                                            <div class="kt-ws-meta">
                                                <div class="kt-ws-meta__item">
                                                    <span class="kt-ws-meta__label"><img class="kt-svg-icon" src="/assets/img/contents/ico_ldap_time.svg" alt="" aria-hidden="true" />생성일</span>
                                                    <strong>2026.03.28</strong>
                                                </div>
                                                <span class="kt-ws-meta__divider" aria-hidden="true"></span>
                                                <div class="kt-ws-meta__item">
                                                    <span class="kt-ws-meta__label"><img class="kt-svg-icon" src="/assets/img/components/ico_user.svg" alt="" aria-hidden="true" />생성자</span>
                                                    <strong>김철수</strong>
                                                </div>
                                                <span class="kt-ws-meta__divider" aria-hidden="true"></span>
                                                <div class="kt-ws-meta__item">
                                                    <span class="kt-ws-meta__label"><img class="kt-svg-icon" src="/assets/img/contents/ico_ldap_building.svg" alt="" aria-hidden="true" />소속</span>
                                                    <strong>하나로소프트</strong>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="kt-ws-status-note kt-ws-status-note--rejected">
                                            <div class="kt-ws-status-note__message">
                                                <span class="kt-ws-status-note__icon" aria-hidden="true"></span>
                                                <p>Key 갱신 요청이 반려되었으니 사유를 확인 후 재신청하세요.</p>
                                            </div>
                                            <div class="kt-ws-status-note__reason">
                                                <span class="kt-reject-reason__tag">반려 사유</span>

                                            </div>
