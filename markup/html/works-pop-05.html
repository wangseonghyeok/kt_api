<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body class="kt-work-pop-page">
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="PRD IP 승인요청">
                    <article class="kt-work-pop kt-work-pop--h575">
                        <header class="kt-work-pop__header">
                            <h1 class="kt-work-pop__title">PRD IP 승인요청</h1>
                            <button type="button" class="kt-work-pop__close popup__close" aria-label="닫기">
                                <img src="/assets/img/auth/ico_auth_close.svg" alt="" aria-hidden="true" />
                            </button>
                        </header>
                        <div class="kt-work-pop__body">
                            <div class="kt-work-pop__content">
                                <div class="kt-work-pop__section kt-work-pop__section--gap16">
                                    <strong class="kt-work-pop__section-title">IP 변경</strong>
                                    <div class="kt-work-pop__ip-box kt-work-pop__ip-box--list">
                                        <div class="kt-work-pop__ip-row">
                                            <span class="kt-work-pop__ip-left"><span class="kt-work-pop__mini-tag kt-work-pop__mini-tag--add">추가</span>PRD</span>
                                            <span class="kt-work-pop__ip-value">211.11.2.34</span>
                                        </div>
                                        <div class="kt-work-pop__ip-row">
                                            <span class="kt-work-pop__ip-left"><span class="kt-work-pop__mini-tag kt-work-pop__mini-tag--delete">삭제</span>PRD</span>
                                            <span class="kt-work-pop__ip-value">11.11.12.12</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="kt-work-pop__field kt-work-pop__field--large">
                                    <p class="kt-work-pop__label">신청사유 <span class="kt-work-pop__required">*</span></p>
                                    <div class="kt-work-pop__textarea-box" role="textbox" aria-label="신청사유">
                                        <p>필요한 사유를 입력해 주세요.</p>
                                        <span class="kt-work-pop__fake-scroll" aria-hidden="true"></span>
                                        <span class="kt-work-pop__textarea-count">0/200</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="kt-work-pop__footer">
                            <button type="button" class="kt-work-pop__button kt-work-pop__button--secondary popup__close">취소</button>
                            <button type="button" class="kt-work-pop__button">승인요청</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
