<!DOCTYPE html>
<html lang="ko">
    <head>
        <!--#include file="./include/_head.html"-->
        <link rel="stylesheet" type="text/css" href="/assets/css/contents.min.css" />
    </head>

    <body class="kt-work-pop-page">
        <div id="wrap">
            <div class="kt-work-pop-modal">
                <main class="kt-work-pop-stage" aria-label="민감 API 승인신청">
                    <article class="kt-work-pop kt-work-pop--h780">
                        <header class="kt-work-pop__header">
                            <h1 class="kt-work-pop__title">민감 API 승인신청</h1>
                            <button type="button" class="kt-work-pop__close popup__close" aria-label="닫기">
                                <img src="/assets/img/works/ico_work_close.svg" alt="" aria-hidden="true" />
                            </button>
                        </header>
                        <div class="kt-work-pop__body">
                            <div class="kt-work-pop__content">
                                <div class="kt-work-pop__notice">
                                    <img src="/assets/img/works/ico_work_warning.svg" alt="" aria-hidden="true" />
                                    <p><strong>민감 파라미터를 포함한 API가 있으므로 각 API의 사용 사유를 입력해 주세요.</strong><br />승인 완료 전까지 해당 API는 승인대기 상태로 표시됩니다.</p>
                                </div>
                                <div class="kt-work-pop__section">
                                    <div class="kt-work-pop__section">
                                        <div class="kt-work-pop__api-head">
                                            <span>IF_199</span>
                                            <strong class="kt-work-pop__api-name">authenticateUserByAppInfo (SCAP)</strong>
                                            <span class="kt-work-pop__sensitive">민감 1</span>
                                        </div>
                                        <div class="kt-work-pop__field kt-work-pop__field--medium">
                                            <p class="kt-work-pop__label">신청사유 <span class="kt-work-pop__required">*</span></p>
                                            <div class="kt-work-pop__textarea-box" role="textbox" aria-label="신청사유">
                                                <p>사용해야 하는 이유를 구체적으로 입력해 주세요.</p>
                                                <span class="kt-work-pop__fake-scroll" aria-hidden="true"></span>
                                                <span class="kt-work-pop__textarea-count">0/200</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="kt-work-pop__section">
                                        <div class="kt-work-pop__api-head">
                                            <span>OIF_21004</span>
                                            <strong class="kt-work-pop__api-name">getMemberShipPointInfo</strong>
                                            <span class="kt-work-pop__sensitive">민감 1</span>
                                        </div>
                                        <div class="kt-work-pop__field kt-work-pop__field--medium">
                                            <p class="kt-work-pop__label">신청사유 <span class="kt-work-pop__required">*</span></p>
                                            <div class="kt-work-pop__textarea-box" role="textbox" aria-label="신청사유">
                                                <p>사용해야 하는 이유를 구체적으로 입력해 주세요.</p>
                                                <span class="kt-work-pop__fake-scroll" aria-hidden="true"></span>
                                                <span class="kt-work-pop__textarea-count">0/200</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <footer class="kt-work-pop__footer">
                            <button type="button" class="kt-work-pop__button kt-work-pop__button--secondary popup__close">취소</button>
                            <button type="button" class="kt-work-pop__button">민감 API 승인신청</button>
                        </footer>
                    </article>
                </main>
            </div>
            <div id="dim"></div>
        </div>
    </body>
</html>
